name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :core:test assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CronWork-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CronWork build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: CronWork-${{ github.run_number }}.apk
